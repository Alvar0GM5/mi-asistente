<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0d0e12;
            background-image: url('Sharingan.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background: rgba(13, 14, 18, 0.75);
            backdrop-filter: blur(8px);
        }

        /* Panel Lateral (Sidebar) */
        .sidebar {
            width: 260px;
            background: rgba(18, 20, 26, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .new-chat-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover { background: #dc2626; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .delete-chat {
            color: #ef4444;
            opacity: 0.6;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-chat:hover { opacity: 1; }

        /* Área Principal de Chat */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background: rgba(26, 29, 38, 0.9);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-header {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            font-size: 14px;
            margin-right: 12px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .user-message {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: rgba(30, 34, 45, 0.9);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Área del Input y Archivos Adjuntos */
        .chat-input-container {
            padding: 16px;
            background: rgba(22, 25, 34, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remove-file {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            background: rgba(33, 38, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px 8px;
            align-items: center;
            gap: 8px;
        }

        .attach-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .attach-btn:hover { color: #f8fafc; }

        .chat-input-area input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .send-btn.stop-mode { background: #64748b; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">+ Nueva conversación</button>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="avatar-header">IA</div>
                <div>
                    <h2 style="font-size: 15px;">Mi Asistente</h2>
                    <p style="font-size: 12px; color: #10b981;">En línea</p>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-container">
                <div class="file-preview" id="filePreview"></div>
                <div class="chat-input-area">
                    <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Adjuntar foto, vídeo, audio o PDF">📎</button>
                    <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFileSelect(event)">
                    <input type="text" id="userInput" placeholder="Escribe un mensaje o adjunta un archivo..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" id="sendBtn" onclick="toggleSendOrStop()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem("ai_chats")) || {};
        let currentChatId = localStorage.getItem("current_chat_id") || null;
        let currentAbortController = null;
        let selectedFiles = [];

        function saveState() {
            localStorage.setItem("ai_chats", JSON.stringify(chats));
            localStorage.setItem("current_chat_id", currentChatId);
        }

        function init() {
            if (!currentChatId || !chats[currentChatId]) {
                createNewChat();
            } else {
                renderSidebar();
                renderMessages();
            }
        }

        function createNewChat() {
            const id = "chat_" + Date.now();
            chats[id] = {
                title: "Nueva conversación",
                messages: [{ role: "model", text: "¡Hola! ¿En qué puedo ayudarte hoy?" }]
            };
            currentChatId = id;
            saveState();
            renderSidebar();
            renderMessages();
        }

        function switchChat(id) {
            currentChatId = id;
            saveState();
            renderSidebar();
            renderMessages();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            delete chats[id];
            const keys = Object.keys(chats);
            if (keys.length > 0) {
                currentChatId = keys[0];
            } else {
                createNewChat();
                return;
            }
            saveState();
            renderSidebar();
            renderMessages();
        }

        function renderSidebar() {
            const chatList = document.getElementById("chatList");
            chatList.innerHTML = "";

            Object.keys(chats).reverse().forEach(id => {
                const item = document.createElement("div");
                item.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(id);

                item.innerHTML = `
                    <span class="chat-title">${chats[id].title}</span>
                    <span class="delete-chat" onclick="deleteChat('${id}', event)">&times;</span>
                `;
                chatList.appendChild(item);
            });
        }

        function renderMessages() {
            const chatMessages = document.getElementById("chatMessages");
            chatMessages.innerHTML = "";

            const activeChat = chats[currentChatId];
            if (!activeChat) return;

            activeChat.messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `message ${msg.role === 'user' ? 'user-message' : 'ai-message'}`;
                div.innerHTML = marked.parse(msg.text);
                chatMessages.appendChild(div);
            });

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            selectedFiles = selectedFiles.concat(files);
            renderFilePreview();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFilePreview();
        }

        function renderFilePreview() {
            const preview = document.getElementById("filePreview");
            preview.innerHTML = "";
            selectedFiles.forEach((file, idx) => {
                const badge = document.createElement("div");
                badge.className = "file-badge";
                badge.innerHTML = `
                    <span>📄 ${file.name}</span>
                    <span class="remove-file" onclick="removeFile(${idx})">&times;</span>
                `;
                preview.appendChild(badge);
            });
        }

        async function uploadFileToGemini(file) {
            const initRes = await fetch("/api/upload", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    mimeType: file.type,
                    numBytes: file.size,
                    displayName: file.name
                })
            });

            if (!initRes.ok) throw new Error("Error al iniciar subida");
            const { uploadUrl } = await initRes.json();

            const uploadRes = await fetch(uploadUrl, {
                method: "POST",
                headers: {
                    "X-Goog-Upload-Offset": "0",
                    "X-Goog-Upload-Command": "upload, finalize"
                },
                body: file
            });

            if (!uploadRes.ok) throw new Error("Error al subir archivo");
            const fileData = await uploadRes.json();
            return {
                fileUri: fileData.file.uri,
                mimeType: file.type
            };
        }

        function toggleSendOrStop() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
                setSendButtonMode(false);
            } else {
                sendMessage();
            }
        }

        function setSendButtonMode(isGenerating) {
