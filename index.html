<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0d0e12;
            background-image: url('Sharingan.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: rgba(18, 20, 26, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            background: rgba(26, 29, 38, 0.9);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-header {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            font-size: 14px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .header-info h2 {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
        }

        .header-info p {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }

        .user-message {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .ai-message {
            background: rgba(30, 34, 45, 0.9);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-input-container {
            padding: 12px 16px 16px;
            background: rgba(22, 25, 34, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Lista de previsualización de archivos */
        .preview-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .preview-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .remove-file {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            background: rgba(33, 38, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px 8px;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .chat-input-area:focus-within {
            border-color: #ef4444;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .attach-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .attach-btn:hover {
            color: #f8fafc;
        }

        .send-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #dc2626;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar-header">IA</div>
            <div class="header-info">
                <h2>Mi Asistente</h2>
                <p><span class="status-dot"></span>En línea</p>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">El sistema está preparado. Puedes enviarme texto, imágenes, vídeos o documentos.</div>
        </div>
        
        <div class="chat-input-container">
            <div class="preview-list" id="previewList"></div>
            
            <div class="chat-input-area">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Adjuntar archivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">
                
                <input type="text" id="userInput" placeholder="Escribe un mensaje o adjunta archivos..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "/api/chat";
        let selectedFiles = [];

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Data = e.target.result.split(',')[1];
                    selectedFiles.push({
                        name: file.name,
                        mimeType: file.type || "application/octet-stream",
                        base64Data: base64Data
                    });
                    updatePreview();
                };
                reader.readAsDataURL(file);
            });
            event.target.value = "";
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updatePreview();
        }

        function updatePreview() {
            const previewList = document.getElementById("previewList");
            previewList.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "preview-item";
                item.innerHTML = `<span>📄 ${file.name}</span> <span class="remove-file" onclick="removeFile(${index})">&times;</span>`;
                previewList.appendChild(item);
            });
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText && selectedFiles.length === 0) return;

            const chatMessages = document.getElementById("chatMessages");

            // Mostrar mensaje enviado por el usuario
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            let displayContent = messageText;
            if (selectedFiles.length > 0) {
                const fileNames = selectedFiles.map(f => f.name).join(", ");
                displayContent += (displayContent ? "\n\n" : "") + `📎 [Archivos: ${fileNames}]`;
            }
            userDiv.textContent = displayContent;
            chatMessages.appendChild(userDiv);

            const payloadFiles = [...selectedFiles];
            selectedFiles = [];
            updatePreview();
            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Crear caja para respuesta streaming
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message ai-message";
            chatMessages.appendChild(loadingDiv);

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText, files: payloadFiles })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const jsonStr = line.replace("data: ", "").trim();
                            if (jsonStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                const chunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
                                fullText += chunk;
                                loadingDiv.innerHTML = marked.parse(fullText);
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }
            } catch (error) {
                loadingDiv.textContent = "Error de conexión con el servidor.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
