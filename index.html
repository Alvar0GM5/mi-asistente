<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente de IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 80vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            border-top: 1px solid #e5e7eb;
            padding: 10px;
            background: white;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }
        .chat-input-area button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Asistente Gemini</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">¡Hola! ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE CLOUDFLARE WORKER ENTRE LAS COMILLAS
        const WORKER_URL = "https://dulce-sueño-7013.alvarogomez66481.workers.dev";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById("chatMessages");

            // Mostrar mensaje del usuario
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = messageText;
            chatMessages.appendChild(userDiv);

            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mostrar estado de carga temporal
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message ai-message";
            loadingDiv.textContent = "Pensando...";
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Petición a tu Cloudflare Worker
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                // Reemplazar "Pensando..." por la respuesta real de Gemini
                if (data.reply) {
                    loadingDiv.textContent = data.reply;
                } else {
                    loadingDiv.textContent = "Hubo un error al procesar la respuesta.";
                }
            } catch (error) {
                loadingDiv.textContent = "Error de conexión con el servidor.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
