<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 85vh;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }
        .chat-header {
            background: #2d2d2d;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
        }
        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background: #2a2a2a;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #444;
        }
        .chat-input-area {
            display: flex;
            border-top: 1px solid #333;
            padding: 12px;
            background: #1e1e1e;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #3b82f6;
        }
        .chat-input-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div>Mi Asistente</div>
            <div style="font-size: 11px; color: #888; font-weight: normal;">Tu asistente personal</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">El sistema está preparado. ¿En qué puedo ayudarte?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe algo..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Tu URL exacta de Cloudflare Worker (corregida sin tilde)
        const WORKER_URL = "https://mi-asistente.alvarogm56481.workers.dev";
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById("chatMessages");

            // Mostrar mensaje del usuario
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = messageText;
            chatMessages.appendChild(userDiv);

            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mostrar estado de carga temporal ("Pensando...")
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message ai-message";
            loadingDiv.textContent = "Pensando...";
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Enviar petición POST a tu Worker de Cloudflare
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                // Mostrar respuesta real de Gemini
                if (data.reply) {
                    loadingDiv.textContent = data.reply;
                } else {
                    loadingDiv.textContent = "Respuesta vacía del servidor.";
                }
            } catch (error) {
                loadingDiv.textContent = "Error de conexión con el servidor.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
